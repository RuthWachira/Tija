{% extends "base.html" %}

{% block content %}
<table class="table table-hover table-bordered goals-table">
    <thead>
        <tr>
            <th>Goal Name</th>
            <th>Description</th>
            <th>Date created</th>
        </tr>
    </thead>
    <tbody>
        {% for goal in goals %}
        <tr>
            <td> 
                <a href={% url 'goals:detail' goal.id %}>{{goal.name}}</a> 
            </td>
            <td>{{goal.description}} </td>
            <td>{{goal.created_at}} </td>
        </tr>
        {% endfor %}
    </tbody>


</table>
{% endblock %}
